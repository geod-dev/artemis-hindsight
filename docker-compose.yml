# Artemis Hindsight: one container per concern.
#
# Networks:
#   data         web, migrate, toolbox, postgres, hindsight
#   sandbox-net  toolbox, sandbox   (the agent's computer is reachable only through the toolbox)
#
# Every service has a healthcheck, or an explicit `healthcheck: disable: true` when it is a one-shot job.
# For Coolify, use docker-compose.coolify.yml instead.
#
# Start:  cp .env.example .env   (then set ANTHROPIC_API_KEY)
#         docker compose up --build
name: artemis-hindsight

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: artemis
      POSTGRES_PASSWORD: artemis
      POSTGRES_DB: artemis
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artemis -d artemis"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    restart: unless-stopped

  hindsight:
    # Long-term memory server. Uses its embedded pg0 store (volume below), not the Postgres above.
    image: ghcr.io/vectorize-io/hindsight:latest
    shm_size: 1g
    environment:
      HINDSIGHT_API_LLM_PROVIDER: anthropic
      HINDSIGHT_API_LLM_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      HINDSIGHT_API_LLM_MODEL: claude-haiku-5-5
      HINDSIGHT_API_WORKER_ID: artemis-hindsight
      # No consolidation after each retain: duplicates copies of each fact. The daily job in the web app runs it instead.
      HINDSIGHT_API_ENABLE_AUTO_CONSOLIDATION: "false"
    volumes:
      - hindsight-data:/home/hindsight/.pg0
    ports:
      - "127.0.0.1:8888:8888"  # API
      - "127.0.0.1:9999:9999"  # Control Plane (web UI)
    healthcheck:
      # /health/ready answers 200 once the API reaches its database (503 before that). The image has no curl.
      test: ["CMD", "/app/api/.venv/bin/python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health/ready', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 90s
    networks: [data]
    restart: unless-stopped

  sandbox:
    # The agent's computer: /data/sessions/<id> holds each conversation's files and attachments; /workspace is shared
    # across conversations. No published ports.
    build:
      context: .
      dockerfile: services/sandbox/Dockerfile
    volumes:
      - sandbox-data:/data
      - sandbox-workspace:/workspace
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks: [sandbox-net]
    restart: unless-stopped

  toolbox:
    # Lists and runs tools. Calls the sandbox; the backend calls it.
    build:
      context: .
      dockerfile: services/toolbox/Dockerfile
    environment:
      SANDBOX_URL: http://sandbox:8080
      HINDSIGHT_URL: http://hindsight:8888  # the memory tools: retain, recall, reflect
      EXA_API_KEY: ${EXA_API_KEY:-}  # optional: enables the Exa MCP tools
    depends_on:
      sandbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks: [data, sandbox-net]
    restart: unless-stopped

  migrate:
    # One-shot: applies the database schema before the web app starts. It exits by design, so it has no healthcheck.
    build:
      context: .
      dockerfile: services/web/Dockerfile
    command: ["npm", "run", "db:migrate", "-w", "@artemis/web"]
    environment:
      DATABASE_URL: postgres://artemis:artemis@postgres:5432/artemis
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    networks: [data]
    restart: "no"

  web:
    # Next.js: the chat UI and the agent backend (/api/chat). Its healthcheck is /api/health (database reachable).
    build:
      context: .
      dockerfile: services/web/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://artemis:artemis@postgres:5432/artemis
      HINDSIGHT_URL: http://hindsight:8888
      TOOLBOX_URL: http://toolbox:8080
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      toolbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [data]
    restart: unless-stopped

networks:
  data: {}
  sandbox-net: {}

volumes:
  postgres-data: {}
  hindsight-data: {}
  sandbox-data: {}
  sandbox-workspace: {}

# Artemis Hindsight for Coolify. In the Coolify resource, set "Docker Compose Location" to this file.
#
# Secrets and settings come from the Coolify environment variables. Variables marked :? are required:
# Coolify refuses to deploy while they are empty. Nothing is published on the host: Coolify's proxy routes
# the domain set on `web` (SERVICE_URL_WEB_3000) to port 3000.
#
# Every service has a healthcheck, or an explicit `healthcheck: disable: true` with `exclude_from_hc: true`
# when it is a one-shot job. Coolify computes the overall status from these.
#
# Required: POSTGRES_PASSWORD, ANTHROPIC_API_KEY, AUTH_SECRET (32+ chars), ADMIN_ACCESS_KEY (16+ chars).
# POSTGRES_PASSWORD goes inside DATABASE_URL: use letters and digits only (e.g. openssl rand -hex 32).
# Optional: GROQ_API_KEY (dictation), CHAT_MODEL, TITLE_MODEL, MAX_AGENT_STEPS, MEMORY_RECALL_BUDGET,
# MEMORY_RECALL_MAX_TOKENS.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: artemis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Coolify}
      POSTGRES_DB: artemis
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artemis -d artemis"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    restart: unless-stopped

  hindsight:
    # Long-term memory server. Uses its embedded pg0 store (volume below), not the Postgres above.
    image: ghcr.io/vectorize-io/hindsight:latest
    shm_size: 1g
    environment:
      HINDSIGHT_API_LLM_PROVIDER: anthropic
      HINDSIGHT_API_LLM_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in Coolify}
      HINDSIGHT_API_LLM_MODEL: claude-haiku-5-5
      HINDSIGHT_API_WORKER_ID: artemis-hindsight
    volumes:
      - hindsight-data:/home/hindsight/.pg0
    healthcheck:
      # /health/ready answers 200 once the API reaches its database (503 before that). The image has no curl.
      test: ["CMD", "/app/api/.venv/bin/python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health/ready', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 90s
    networks: [data]
    restart: unless-stopped

  sandbox:
    # The agent's computer: /data/sessions/<id> holds each conversation's files and attachments; /workspace is shared
    # across conversations. Reachable only through the toolbox.
    build:
      context: .
      dockerfile: services/sandbox/Dockerfile
    volumes:
      - sandbox-data:/data
      - sandbox-workspace:/workspace
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks: [sandbox-net]
    restart: unless-stopped

  toolbox:
    # Lists and runs tools. Calls the sandbox; the backend calls it.
    build:
      context: .
      dockerfile: services/toolbox/Dockerfile
    environment:
      SANDBOX_URL: http://sandbox:8080
      EXA_API_KEY: ${EXA_API_KEY:-}  # optional: enables the Exa MCP tools
    depends_on:
      sandbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks: [data, sandbox-net]
    restart: unless-stopped

  migrate:
    # One-shot: applies the database schema before the web app starts. It exits by design, so it is left out of the
    # overall health (exclude_from_hc) and has no healthcheck.
    build:
      context: .
      dockerfile: services/web/Dockerfile
    command: ["npm", "run", "db:migrate", "-w", "@artemis/web"]
    environment:
      DATABASE_URL: postgres://artemis:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Coolify}@postgres:5432/artemis
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    exclude_from_hc: true
    networks: [data]
    restart: "no"

  web:
    # Next.js: the chat UI and the agent backend (/api/chat). Public through Coolify's proxy on port 3000.
    build:
      context: .
      dockerfile: services/web/Dockerfile
    environment:
      SERVICE_URL_WEB_3000:
      DATABASE_URL: postgres://artemis:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Coolify}@postgres:5432/artemis
      HINDSIGHT_URL: http://hindsight:8888
      TOOLBOX_URL: http://toolbox:8080
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in Coolify}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-claude-haiku-5-5}
      TITLE_MODEL: ${TITLE_MODEL:-claude-haiku-5-5}
      MAX_AGENT_STEPS: ${MAX_AGENT_STEPS:-12}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in Coolify (32+ characters)}
      ADMIN_ACCESS_KEY: ${ADMIN_ACCESS_KEY:?set ADMIN_ACCESS_KEY in Coolify (16+ characters)}
      MEMORY_RECALL_BUDGET: ${MEMORY_RECALL_BUDGET:-low}
      MEMORY_RECALL_MAX_TOKENS: ${MEMORY_RECALL_MAX_TOKENS:-1024}
    expose: ["3000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      toolbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [data]
    restart: unless-stopped

networks:
  data: {}
  sandbox-net: {}

volumes:
  postgres-data: {}
  hindsight-data: {}
  sandbox-data: {}
  sandbox-workspace: {}
